apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: expense-tracker-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  # The root app creates the dedicated project it will later use. It must therefore
  # start in Argo CD's built-in project rather than depend on that project already
  # existing.
  project: default
  source:
    repoURL: https://github.com/damirtat/ExpenseTrackerGitOps.git
    targetRevision: main
    # Argo CD autodetects argocd/apps/kustomization.yaml. Do not add
    # directory.recurse here: that makes Argo treat the Kustomization file as
    # an ordinary Kubernetes resource instead of rendering it.
    path: argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
