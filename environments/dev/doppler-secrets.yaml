apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: expense-tracker-dev-postgres
  namespace: doppler-operator-system
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  # Bootstrapped outside Git. This read-only token is restricted to
  # expense-tracker-api/dev_k3s.
  tokenSecret:
    name: expense-tracker-dev-doppler-token
  secrets:
    - POSTGRES_DB
    - POSTGRES_PASSWORD
    - POSTGRES_USER
  managedSecret:
    name: expense-tracker-postgres
    namespace: expense-tracker
    type: Opaque
---
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: expense-tracker-dev-api-runtime
  namespace: doppler-operator-system
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  tokenSecret:
    name: expense-tracker-dev-doppler-token
  secrets:
    - ASPNETCORE_ENVIRONMENT
    - AUTH0__AUDIENCE
    - AUTH0__DOMAIN
    - CORS_ALLOWED_ORIGINS
    - EXPENSE_TRACKER_DB_CONNECTION_STRING
  managedSecret:
    name: expense-tracker-api-runtime
    namespace: expense-tracker
    type: Opaque
---
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: expense-tracker-dev-web-runtime
  namespace: doppler-operator-system
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  tokenSecret:
    name: expense-tracker-dev-doppler-token
  secrets:
    - API_BASE_URL
    - AUTH0_AUDIENCE
    - AUTH0_CLIENT_ID
    - AUTH0_DOMAIN
  managedSecret:
    name: expense-tracker-web-runtime
    namespace: expense-tracker
    type: Opaque
