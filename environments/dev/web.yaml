apiVersion: v1
kind: Service
metadata:
  name: expense-tracker-web
  namespace: expense-tracker
  labels:
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: expense-tracker
    environment: dev
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  selector:
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: expense-tracker-web
  namespace: expense-tracker
  labels:
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: expense-tracker
    environment: dev
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: expense-tracker
        environment: dev
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: web
          image: ghcr.io/damirtat/expensetrackerweb/expense-tracker-web:sha-2be00b817d7445ace43a37c8333362c287121cbf
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - secretRef:
                name: expense-tracker-web-runtime
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
