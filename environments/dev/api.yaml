apiVersion: v1
kind: Service
metadata:
  name: expense-tracker-api
  namespace: expense-tracker
  labels:
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: expense-tracker
    environment: dev
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  selector:
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: expense-tracker-api
  namespace: expense-tracker
  labels:
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: expense-tracker
    environment: dev
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: expense-tracker
        environment: dev
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: api
          image: ghcr.io/damirtat/expensetrackerapi/expense-tracker-api:sha-6b0809f89d4f18437a241a7b6982c1bd4303940a
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - secretRef:
                name: expense-tracker-api-runtime
          env:
            - name: DATABASE__APPLY_MIGRATIONS_ON_STARTUP
              value: "false"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
