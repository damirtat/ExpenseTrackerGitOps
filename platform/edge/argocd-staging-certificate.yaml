apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd-tls-staging
  namespace: argocd
spec:
  # This certificate deliberately uses the Let's Encrypt staging endpoint first.
  # It validates the Cloudflare DNS-01 path without consuming production limits.
  secretName: argocd-tls-staging
  issuerRef:
    name: letsencrypt-staging
    kind: ClusterIssuer
  dnsNames:
    - argocd.tatalovic.dev
