apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: expense-tracker-argocd-auth0
  namespace: doppler-operator-system
spec:
  # The operator credential is bootstrapped outside Git and has read-only access
  # to the Expense Tracker development config only.
  tokenSecret:
    name: expense-tracker-api-doppler-token
  secrets:
    - ARGOCD_AUTH0_CLIENT_ID
    - ARGOCD_AUTH0_CLIENT_SECRET
  managedSecret:
    name: argocd-auth0-oidc
    namespace: argocd
    type: Opaque
    labels:
      # Required by Argo CD when resolving $secret:key values from argocd-cm.
      app.kubernetes.io/part-of: argocd
